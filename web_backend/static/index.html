<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TikTok 自动化管理后台</title>
    <!-- 使用备用 CDN 镜像 (unpkg.com) 解决 jsdelivr 被封锁的问题 -->
    <script src="https://unpkg.com/react@18.2.0/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18.2.0/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone@7.22.10/babel.min.js"></script>
    <script src="https://unpkg.com/tailwindcss-cdn@3.4.10/tailwindcss.js"></script>
    <script src="https://unpkg.com/chart.js@4.4.3/dist/chart.umd.js"></script>
    <!-- 图标库 -->
    <script src="https://unpkg.com/lucide@0.321.0/dist/umd/lucide.min.js"></script>
    <style>
        /* 使用备用字体，避免 Google Fonts 加载慢导致页面白屏 */
        body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: #f8fafc; }
        .glass-card { background: rgba(255, 255, 255, 0.8); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.3); }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(0, 0, 0, 0.05); border-radius: 10px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: rgba(0, 0, 0, 0.1); }
        
        /* 修复 Lucide 图标显示 */
        .lucide { width: 1.25rem; height: 1.25rem; vertical-align: text-bottom; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        // 确保 React 全局变量可用
        const { useState, useEffect, useRef } = React;

        const API_BASE = "";

        // 简单的图标组件
        const Icon = ({ name, className = "" }) => {
            const iconRef = useRef(null);
            useEffect(() => {
                if (window.lucide && iconRef.current) {
                    try {
                        window.lucide.createIcons({
                            attrs: { class: `lucide ${className}` },
                            nameMap: { [name]: iconRef.current }
                        });
                    } catch (e) {
                        console.error('Lucide error:', e);
                    }
                }
            }, [name, className]);
            return <i data-lucide={name} ref={iconRef} className={className}></i>;
        };

        const Card = ({ title, value, icon, color }) => (
            <div className="glass-card p-6 rounded-2xl shadow-sm flex items-center space-x-4 border border-slate-100 hover:shadow-md transition-shadow">
                <div className={`p-3 rounded-xl ${color} bg-opacity-10 text-xl flex items-center justify-center`}>
                    <Icon name={icon} className={`${color.replace('bg-', 'text-')}`} />
                </div>
                <div>
                    <p className="text-sm font-medium text-slate-500">{title}</p>
                    <p className="text-2xl font-bold text-slate-800">{value}</p>
                </div>
            </div>
        );

        const App = () => {
            console.log("App initializing...");
            const [platform, setPlatform] = useState('tiktok'); // 'tiktok' or 'xhs'
            
            // 切换平台时清除数据，防止串号
            const switchPlatform = (newPlatform) => {
                setPlatform(newPlatform);
                setStats({ pending: 0, processing: 0, done: 0, failed: 0 });
                setTasks([]);
                setAllStats({});
                setHistoryData({ trend: [], rates: { like: 0, comment: 0, reply: 0 } });
            };
            
            // 动态主题常量
            const isXHS = platform === 'xhs';
            const themeColor = isXHS ? 'red-500' : 'indigo-600';
            const themeBg = isXHS ? 'bg-red-500' : 'bg-indigo-600';
            const themeText = isXHS ? 'text-red-500' : 'text-indigo-600';
            const themeRing = isXHS ? 'ring-red-500' : 'ring-indigo-500';
            const themeShadow = isXHS ? 'shadow-red-100' : 'shadow-indigo-100';
            const [stats, setStats] = useState({ pending: 0, processing: 0, done: 0, failed: 0 });
            const [allStats, setAllStats] = useState({});
            const [tasks, setTasks] = useState([]);
            const [devices, setDevices] = useState([]);
            const [activeTab, setActiveTab] = useState('dashboard');
            const [taskFilter, setTaskFilter] = useState('all');
            const [deptFilter, setDeptFilter] = useState('pet');
            const [selectedTasks, setSelectedTasks] = useState([]);
            const [logs, setLogs] = useState({ scout: '', grabber: '', pet_grabber: '', bci_grabber: '', uav_grabber: '' });
            const [activeLogSource, setActiveLogSource] = useState('pet_grabber');
            const [autoScroll, setAutoScroll] = useState(true);
            const [historyDays, setHistoryDays] = useState(7);
            const [historyData, setHistoryData] = useState({ trend: [], rates: { like: 0, comment: 0, reply: 0 } });
            const [hitStats, setHitStats] = useState({ day: 0, week: 0, month: 0, year: 0 });
            const [taskStats, setTaskStats] = useState({ day: 0, week: 0, month: 0, year: 0 });
            
            // 精准查询相关状态
            const [queryType, setQueryType] = useState('single'); // 'single' or 'range'
            const [selectedDate, setSelectedDate] = useState(new Date().toISOString().split('T')[0]);
            const [startDate, setStartDate] = useState('');
            const [endDate, setEndDate] = useState('');
            const [customResult, setCustomResult] = useState(null); // { hit: 0, task: 0 }
            const [hitPeriod, setHitPeriod] = useState('day');
            const [wirelessConfig, setWirelessConfig] = useState({ ip: '', port: 5555 });
            const [pairConfig, setPairConfig] = useState({ ip: '', port: '', code: '' });
            const [showPairModal, setShowPairModal] = useState(false);
            const [corpus, setCorpus] = useState({ dm: [], comment: [], reply: [] });
            const [showCorpusModal, setShowCorpusModal] = useState(false);
            const [corpusType, setCorpusType] = useState('dm'); // 'dm', 'comment', 'reply'
            const [isManagingCorpus, setIsManagingCorpus] = useState(false);
            const [editingScene, setEditingScene] = useState(null); // { idx: number, name: string, texts: string[] } or null
            const [petConfig, setPetConfig] = useState({ ui_ids: {}, pet_translator_workflow: { custom_comments: [] } });
            const [showPetIds, setShowPetIds] = useState(false);
            const [editingPetId, setEditingPetId] = useState(null); // { key: string, value: string }

            const [scoutConfig, setScoutConfig] = useState({ ui_ids: {}, search: { keywords: '' } });
            const [showScoutIds, setShowScoutIds] = useState(false);
            const [editingScoutId, setEditingScoutId] = useState(null); // { key: string, value: string }

            const safeFetch = async (url, fallback = {}) => {
                try {
                    const res = await fetch(url);
                    if (!res.ok) throw new Error(`HTTP ${res.status}`);
                    return await res.json();
                } catch (e) {
                    console.warn(`Fetch failed for ${url}:`, e);
                    return fallback;
                }
            };

            const fetchPetConfig = async () => {
                const data = await safeFetch(`${API_BASE}/config/pet_grabber`, { pet_translator_workflow: { custom_comments: [] } });
                setPetConfig(data);
            };

            const fetchScoutConfig = async () => {
                const data = await safeFetch(`${API_BASE}/config/scout`, { ui_ids: {} });
                setScoutConfig(data);
            };

            const updatePetComments = async (texts) => {
                try {
                    // 使用 [SEP] 作为分隔符来处理长段落评论
                    const comments = texts.split('[SEP]').map(t => t.trim()).filter(t => t !== '');
                    const res = await fetch(`${API_BASE}/config/pet_grabber`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            data: {
                                pet_translator_workflow: {
                                    custom_comments: comments
                                }
                            }
                        })
                    });
                    if (res.ok) {
                        alert('宠物话术已保存');
                        fetchPetConfig();
                    }
                } catch (e) {
                    alert('保存宠物话术失败: ' + e.message);
                }
            };

            const updatePetUIIds = async (ids) => {
                try {
                    // 检查是否包含 parent 路径
                    let updateData = { ui_ids: {} };
                    
                    // 优化：根据传入的 ids 结构决定如何构造请求
                    // 如果 ids 本身就包含 pet_translator_workflow，则不应该放在 ui_ids 下面
                    if (ids.pet_translator_workflow) {
                        updateData = { pet_translator_workflow: ids.pet_translator_workflow };
                    } else {
                        updateData = { ui_ids: ids };
                    }

                    const res = await fetch(`${API_BASE}/config/pet_grabber`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            data: updateData
                        })
                    });
                    if (res.ok) {
                        alert('配置已更新');
                        fetchPetConfig();
                    }
                } catch (e) {
                    alert('更新失败: ' + e.message);
                }
            };

            const updateScoutKeywords = async (text) => {
                try {
                    const keywords = text.split(/[\n,，、]/).map(k => k.trim()).filter(k => k !== '');
                    const res = await fetch(`${API_BASE}/config/scout`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            data: { 
                                search: { 
                                    keywords: keywords
                                } 
                            }
                        })
                    });
                    if (res.ok) {
                        alert('Scout 关键词队列已更新');
                        fetchScoutConfig();
                    }
                } catch (e) {
                    alert('更新失败: ' + e.message);
                }
            };

            const updateScoutUIIds = async (ids) => {
                try {
                    const res = await fetch(`${API_BASE}/config/scout`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            data: { ui_ids: ids }
                        })
                    });
                    if (res.ok) {
                        alert('Scout 配置已更新');
                        fetchScoutConfig();
                    }
                } catch (e) {
                    alert('更新失败: ' + e.message);
                }
            };

            const fetchCorpus = async () => {
                const data = await safeFetch(`${API_BASE}/corpus`, { dm: [], comment: [], reply: [] });
                setCorpus(data);
            };

            const saveCorpus = async (updatedCorpus) => {
                try {
                    const res = await fetch(`${API_BASE}/corpus`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(updatedCorpus)
                    });
                    if (res.ok) {
                        setCorpus(updatedCorpus);
                        return true;
                    }
                } catch (e) {
                    alert('保存语料库失败: ' + e.message);
                }
                return false;
            };

            const handleAddScene = () => {
                setEditingScene({ idx: -1, name: '', texts: [''] });
            };

            const handleEditScene = (idx, scene) => {
                setEditingScene({ idx, name: scene.name, texts: [...scene.texts] });
            };

            const handleDeleteScene = async (idx) => {
                if (!confirm('确定要删除这个语料场景吗？')) return;
                const updatedCorpus = { ...corpus };
                updatedCorpus[corpusType].splice(idx, 1);
                await saveCorpus(updatedCorpus);
            };

            const handleSaveScene = async () => {
                if (!editingScene.name.trim()) {
                    alert('请输入场景名称');
                    return;
                }
                const filteredTexts = editingScene.texts.filter(t => t.trim() !== '');
                if (filteredTexts.length === 0) {
                    alert('请至少输入一条话术');
                    return;
                }

                const updatedCorpus = { ...corpus };
                const newScene = { name: editingScene.name, texts: filteredTexts };
                
                if (editingScene.idx === -1) {
                    // Add new
                    if (!updatedCorpus[corpusType]) updatedCorpus[corpusType] = [];
                    updatedCorpus[corpusType].push(newScene);
                } else {
                    // Update existing
                    updatedCorpus[corpusType][editingScene.idx] = newScene;
                }

                if (await saveCorpus(updatedCorpus)) {
                    setEditingScene(null);
                }
            };

            const applyCorpus = (texts) => {
                const textarea = document.getElementById('strategy-text');
                if (textarea) {
                    textarea.value = texts.join('\n');
                    // 模拟输入事件以触发可能存在的 React 状态更新
                    const event = new Event('input', { bubbles: true });
                    textarea.dispatchEvent(event);
                }
                setShowCorpusModal(false);
            };

            const openCorpusModal = () => {
                setCorpusType(grabberMode);
                fetchCorpus(); // 每次打开都刷新数据
                setShowCorpusModal(true);
            };

            useEffect(() => {
                if (activeTab === 'analytics' && historyData.trend.length > 0) {
                    const ChartLib = window.Chart;
                    if (!ChartLib) {
                        console.warn('Chart.js library not loaded yet');
                        return;
                    }

                    const ctx = document.getElementById('trendChart')?.getContext('2d');
                    if (!ctx) return;

                    // 销毁旧实例
                    if (window.myTrendChart) window.myTrendChart.destroy();

                    window.myTrendChart = new ChartLib(ctx, {
                        type: 'line',
                        data: {
                            labels: historyData.trend.map(d => d.day),
                            datasets: [
                                {
                                    label: '总任务数',
                                    data: historyData.trend.map(d => d.total),
                                    borderColor: 'rgb(79, 70, 229)',
                                    backgroundColor: 'rgba(79, 70, 229, 0.1)',
                                    fill: true,
                                    tension: 0.4
                                },
                                {
                                    label: '成功完成',
                                    data: historyData.trend.map(d => d.done),
                                    borderColor: 'rgb(16, 185, 129)',
                                    backgroundColor: 'rgba(16, 185, 129, 0.1)',
                                    fill: true,
                                    tension: 0.4
                                }
                            ]
                        },
                        options: {
                            responsive: true,
                            maintainAspectRatio: false,
                            plugins: {
                                legend: { position: 'top' }
                            },
                            scales: {
                                y: { beginAtZero: true, grid: { display: false } },
                                x: { grid: { display: false } }
                            }
                        }
                    });
                }
            }, [activeTab, historyData]);

            const handleAutoConnect = async () => {
                setLoading(prev => ({ ...prev, 'auto-connect': true }));
                try {
                    const res = await fetch(`${API_BASE}/devices/auto_connect`, {
                        method: 'POST'
                    });
                    const data = await res.json();
                    if (data.status === 'success') {
                        alert(data.message);
                        fetchData();
                    } else {
                        alert(data.message || '连接失败');
                    }
                } catch (e) {
                    alert('连接出错: ' + e.message);
                } finally {
                    setLoading(prev => ({ ...prev, 'auto-connect': false }));
                }
            };

            const handleRestartADB = async () => {
                if (!confirm('确定要重启 ADB 服务吗？这可能会导致当前正在运行的任务中断。')) return;
                setLoading(prev => ({ ...prev, 'restart-adb': true }));
                try {
                    const res = await fetch(`${API_BASE}/devices/restart_adb`, {
                        method: 'POST'
                    });
                    const data = await res.json();
                    if (data.status === 'success') {
                        alert('ADB 服务已重启，请等待几秒钟让设备重新连接。');
                        fetchData();
                    } else {
                        alert(data.message || '重启失败');
                    }
                } catch (e) {
                    alert('重启出错: ' + e.message);
                } finally {
                    setLoading(prev => ({ ...prev, 'restart-adb': false }));
                }
            };

            const handleConnectWireless = async () => {
                if (!wirelessConfig.ip.trim()) {
                    alert('请输入设备 IP 地址');
                    return;
                }
                setLoading(prev => ({ ...prev, 'wireless-connect': true }));
                try {
                    const res = await fetch(`${API_BASE}/devices/connect_wireless`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(wirelessConfig)
                    });
                    const data = await res.json();
                    if (data.status === 'success') {
                        alert(data.message);
                        setWirelessConfig({ ip: '', port: 5555 });
                        fetchData();
                    } else {
                        // 如果连接失败，提示用户是否需要尝试配对
                        if (confirm(`${data.message}\n\n是否需要尝试使用“配对码”进行配对？(针对安卓 11+ 第一次连接)`)) {
                            setPairConfig({ ...pairConfig, ip: wirelessConfig.ip });
                            setShowPairModal(true);
                        }
                    }
                } catch (e) {
                    alert('无线连接出错: ' + e.message);
                } finally {
                    setLoading(prev => ({ ...prev, 'wireless-connect': false }));
                }
            };

            const handlePairWireless = async () => {
                if (!pairConfig.ip || !pairConfig.port || !pairConfig.code) {
                    alert('请完整填写 IP、端口和配对码');
                    return;
                }
                setLoading(prev => ({ ...prev, 'wireless-pair': true }));
                try {
                    const res = await fetch(`${API_BASE}/devices/pair_wireless`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(pairConfig)
                    });
                    const data = await res.json();
                    alert(data.message);
                    if (data.status === 'success') {
                        setShowPairModal(false);
                    }
                } catch (e) {
                    alert('配对出错: ' + e.message);
                } finally {
                    setLoading(prev => ({ ...prev, 'wireless-pair': false }));
                }
            };

            const handleEnableTcpIp = async (serial) => {
                setLoading(prev => ({ ...prev, [`tcpip-${serial}`]: true }));
                try {
                    const res = await fetch(`${API_BASE}/devices/enable_tcpip`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ serial })
                    });
                    const data = await res.json();
                    alert(data.message);
                    fetchData();
                } catch (e) {
                    alert('操作失败: ' + e.message);
                } finally {
                    setLoading(prev => ({ ...prev, [`tcpip-${serial}`]: false }));
                }
            };

            const handleBatchDM = async () => {
                if (selectedTasks.length === 0) {
                    alert('请先选择需要发送私信的任务');
                    return;
                }
                try {
                    const res = await fetch(`${API_BASE}/tasks/batch_dm`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ task_ids: selectedTasks })
                    });
                    const data = await res.json();
                    alert(data.message || '已启动私信任务');
                    setSelectedTasks([]);
                } catch (e) {
                    alert('发送失败: ' + e.message);
                }
            };

            const handleResetTask = async (taskId) => {
                if (!confirm(`确定要重置任务 #${taskId} 吗？`)) return;
                try {
                    const response = await fetch(`${API_BASE}/tasks/${taskId}/reset`, {
                        method: 'POST'
                    });
                    const data = await response.json();
                    if (data.status === 'success') {
                        fetchData(); // 立即刷新数据
                    } else {
                        alert(data.detail || '重置失败');
                    }
                } catch (error) {
                    console.error('Reset task error:', error);
                    alert('重置任务出错');
                }
            };

            const handleRoleChange = async (serial, newRole) => {
                try {
                    const response = await fetch(`${API_BASE}/api/set_role`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ serial, role: newRole })
                    });
                    const data = await response.json();
                    if (data.status === 'success') {
                        fetchData(); // 刷新数据
                    } else {
                        alert(data.message || '设置角色失败');
                    }
                } catch (error) {
                    console.error('Set role error:', error);
                    alert('设置角色出错');
                }
            };

            const toggleTaskSelection = (id) => {
                setSelectedTasks(prev => 
                    prev.includes(id) ? prev.filter(t => t !== id) : [...prev, id]
                );
            };

            const getStatusBadge = (status, isExecuting = false) => {
                const styles = {
                    'done': 'bg-emerald-100 text-emerald-600',
                    'failed': 'bg-rose-100 text-rose-600',
                    'processing': 'bg-indigo-100 text-indigo-600',
                    'pending': 'bg-slate-100 text-slate-500'
                };

                return (
                    <div className="flex flex-col items-center justify-center">
                        <span className={`px-2 py-0.5 rounded-full text-[10px] font-bold transition-all duration-300 ${styles[status] || styles['pending']} ${isExecuting ? 'ring-2 ring-indigo-500 shadow-sm' : ''}`}>
                            {isExecuting ? (
                                <span className="flex items-center">
                                    <span className="w-1 h-1 bg-indigo-600 rounded-full mr-1 animate-ping"></span>
                                    执行中
                                </span>
                            ) : (
                                status === 'done' ? '已完成' : status === 'failed' ? '失败' : status === 'processing' ? '处理中' : '待处理'
                            )}
                        </span>
                    </div>
                );
            };

            const getComputedStatus = (task) => {
                const { like_status, comment_status, reply_status } = task;
                
                // 全部完成
                if (like_status === 'done' && comment_status === 'done' && reply_status === 'done') {
                    return 'done';
                }
                
                // 只要有一个失败，整体标记为失败（为了提醒用户重置）
                if (like_status === 'failed' || comment_status === 'failed' || reply_status === 'failed') {
                    return 'failed';
                }
                
                // 只要有一个在处理中或者已完成（且没全满），就是处理中
                if (like_status !== 'pending' || comment_status !== 'pending' || reply_status !== 'pending') {
                    return 'processing';
                }
                
                return 'pending';
            };
            
            // 进程状态与控制
            const [procStatus, setProcStatus] = useState({ scout_running: false, grabber_running: false, pet_grabber_running: false });
            const [scoutParams, setScoutParams] = useState({ min_stay: 15, max_stay: 20, dept: 'general' });

            useEffect(() => {
                if (deptFilter && deptFilter !== 'all') {
                    setScoutParams(prev => ({ ...prev, dept: deptFilter }));
                }
            }, [deptFilter]);
            const [grabberMode, setGrabberMode] = useState('comment');
            const [petGrabberMode, setPetGrabberMode] = useState('pet_like');
            const [grabberConfig, setGrabberConfig] = useState({ strategies: { dm_texts: [], reply_texts: [] } });
            const [petGrabberConfig, setPetGrabberConfig] = useState({ strategies: { dm_texts: [], reply_texts: [], comment_texts: [] } });
            const [loading, setLoading] = useState({});

            const fetchData = React.useCallback(async () => {
                const apiPrefix = platform === 'xhs' ? '/xhs' : '';
                const statsUrl = (deptFilter === 'all' || !deptFilter) ? `${API_BASE}${apiPrefix}/stats` : `${API_BASE}${apiPrefix}/stats?dept=${deptFilter}`;
                const tasksUrl = (deptFilter === 'all' || !deptFilter) ? `${API_BASE}${apiPrefix}/tasks/recent` : `${API_BASE}${apiPrefix}/tasks/recent?dept=${deptFilter}`;

                // 构建历史数据 URL，支持自定义范围
                let historyUrl = `${API_BASE}${apiPrefix}/stats/history`;
                if (customResult && queryType === 'range' && startDate && endDate) {
                    historyUrl += `?start_date=${startDate}&end_date=${endDate}`;
                } else if (customResult && queryType === 'single' && selectedDate) {
                    // 单日查询也显示前后 7 天的趋势比较好，或者只看那一天
                    historyUrl += `?start_date=${selectedDate}&end_date=${selectedDate}`;
                } else {
                    historyUrl += `?days=${historyDays}`;
                }

                // 并行获取核心数据，但独立处理错误
                const [statsData, tasksData, devicesData, procStatusData, allStatsData, hitData, taskData] = await Promise.all([
                    safeFetch(statsUrl, { pending: 0, processing: 0, done: 0, failed: 0 }),
                    safeFetch(tasksUrl, []),
                    safeFetch(`${API_BASE}/devices`, []),
                    safeFetch(`${API_BASE}/processes/status`, { scout_running: false, grabber_running: false, pet_grabber_running: false }),
                    safeFetch(`${API_BASE}${apiPrefix}/stats/all`, {}),
                    safeFetch(`${API_BASE}/stats/hit?dept=${deptFilter}&period=all`, { day: 0, week: 0, month: 0, year: 0 }),
                    safeFetch(`${API_BASE}/stats/tasks?dept=${deptFilter}&period=all`, { day: 0, week: 0, month: 0, year: 0 })
                ]);

                setStats(statsData || { pending: 0, processing: 0, done: 0, failed: 0 });
                setAllStats(allStatsData || {});
                setTasks(Array.isArray(tasksData) ? tasksData : []);
                setDevices(Array.isArray(devicesData) ? devicesData : []);
                setProcStatus(procStatusData);
                setHitStats(hitData);
                setTaskStats(taskData);

                        platform === 'tiktok' ? safeFetch(`${API_BASE}/config/scout`, { search: { keyword: '' } }) : Promise.resolve({ search: { keyword: '' } }),
                        safeFetch(`${API_BASE}/processes/logs/scout`, { logs: '' }),
                        safeFetch(`${API_BASE}/processes/logs/general`, { logs: '' }),
                        safeFetch(`${API_BASE}/processes/logs/pet`, { logs: '' }),
                        safeFetch(`${API_BASE}/processes/logs/bci`, { logs: '' }),
                        safeFetch(`${API_BASE}/processes/logs/uav`, { logs: '' }),
                        safeFetch(historyUrl, { trend: [], rates: { like: 0, comment: 0, reply: 0 } })
                    ]);

                    setGrabberConfig(grabberConfigData);
                    setScoutConfig(scoutConfigData);
                    setLogs({ 
                        scout: scoutLogs.logs || '', 
                        grabber: generalLogs.logs || '',
                        pet_grabber: petLogs.logs || '',
                        bci_grabber: bciLogs.logs || '',
                        uav_grabber: uavLogs.logs || ''
                    });
                    setHistoryData(hData);

                fetchConfigsAndLogs();

                let hitUrl = `${API_BASE}/stats/hit?dept=${deptFilter}`;
                let taskUrl = `${API_BASE}/stats/tasks?dept=${deptFilter}`;

                if (queryType === 'single') {
                    if (!selectedDate) return alert('请选择日期');
                    hitUrl += `&period=date&date=${selectedDate}`;
                    taskUrl += `&period=date&date=${selectedDate}`;
                } else {
                    if (!startDate || !endDate) return alert('请选择开始和结束日期');
                    hitUrl += `&period=range&start_date=${startDate}&end_date=${endDate}`;
                    taskUrl += `&period=range&start_date=${startDate}&end_date=${endDate}`;
                }

                const [hitCount, taskCount] = await Promise.all([
                    safeFetch(hitUrl, 0),
                    safeFetch(taskUrl, 0)

                setCustomResult({ hit: hitCount, task: taskCount });

            };

                    'dm': 'dm_texts',
                    'reply': 'reply_texts',

                        method: 'POST',

                        body: body ? JSON.stringify(body) : null
                    });
                    const data = await res.json();
                    console.log(`${target} ${action}:`, data);
                    await fetchData();
                } catch (e) {
                    alert(`操作失败: ${e.message}`);
                } finally {
                    setLoading(prev => ({ ...prev, [key]: false }));
                }
            };

                                    )}
                                </div>
                            </div>
                        )}
                    </main>
                </div>
            );
        };

        const rootElement = document.getElementById('root');
        if (rootElement) {
            const root = ReactDOM.createRoot(rootElement);
            root.render(<App />);
            console.log("React app rendered to DOM");
        } else {
            console.error("Root element not found!");
        }
    </script>
</body>
</html>
